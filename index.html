<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset ="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouroboros</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/ouroboros.png">
</head>

<body>

    <div id="desktop">

    <div id="calendar" class="calendar hidden" >
        <h3 id="calendar-title" ></h3>
        <div id="calendar-days"></div>
    </div>

    </div>

    <div id="taskbar">
        <button id="start-btn">Start</button> 
        <button type="button" id="clockbtn" > 
            <img src="images/clock.png"  style="width:20px; height:20px;border-radius:20px;" alt="open clock app">
        </button>

        <div id="running-apps">

        </div>

        <button id="time" >00:00</button>

        
    </div>

    <div id="clock-page" class="clock-page hidden" >
        <h3  >clock</h3>
    </div>



    <script src ="script.js"></script>
</body>
</html>
